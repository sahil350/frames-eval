[build-system]
requires = ["setuptools>=64", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "frames-eval"
dynamic = ["version"]
description = "FRAMES multi-hop reasoning eval for inspect_ai"
requires-python = ">=3.11"
dependencies = [
    "inspect_ai>=0.3.0",
    "httpx>=0.27.0",
    "datasets>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
